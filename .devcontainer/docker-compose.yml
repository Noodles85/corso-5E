services:
  app:
    image: php:8.3-apache
    volumes:
      - ..:/var/www/html:cached
    command: bash -c "docker-php-ext-install mysqli && apache2-foreground"

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: scuola
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
