version: '3.8'
services:
  app:
    image: mcr.microsoft.com/devcontainers/php:8.3-apache
    volumes:
      - ..:/var/www/html:cached
    command: sleep infinity

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: scuola
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
